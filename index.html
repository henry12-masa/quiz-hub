<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>英語クイズまとめ</title>
<meta name="description" content="英単語・英語100問・TOEICクイズを1つのサイトで遊べます。">
<link rel="stylesheet" href="style.css">
</head>
<body>
  
<!-- UIゲーム -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-8398161859137802"
     data-ad-slot="6325875393"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>

<header>
  <h1 id="pageTitle">英語クイズまとめ</h1>
  <p id="pageDesc">好きな英語クイズを選んで挑戦しよう</p>
</header>

<nav id="quizList"></nav>

<main>
  <section class="quiz-box">
    <div class="status">
      <span id="counter">1 / 30</span>
      <span id="score">スコア: 0</span>
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <h2 id="question"></h2>
    <div id="choices"></div>
    <p id="result"></p>
  </section>

  <aside class="ad-box">
    <p>スポンサーリンク</p>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"

    <ins class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-8398161859137802"
      data-ad-slot="5599163841"
      data-ad-format="auto"
      data-full-width-responsive="true"></ins>
    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </aside>
</main>

<script src="script.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
